thiserror = "2.0.17"
pin-project = "1.1.10"
libloading = "0.9.0"
wasmtime = "40.0.1"
serde = "1.0.228"
serde_json = "1.0.149"
anyhow = "1.0.100"


[dev-dependencies]
tracing-test = "0.2.5"
trybuild = "1.0"
macrotest = "1.0"