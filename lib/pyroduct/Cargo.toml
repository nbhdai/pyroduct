[package]
name = "pyroduct"
version = "0.1.0"
authors = ["Sven Cattell"]
edition = "2024"

[features]
capability = []
host = []
module = []

[dependencies]
arrow-scalars = { path = "../arrow-scalars", default-features = false, features = [] }
arrow-derive = { path = "../arrow-derive", default-features = false, features = ["pyroduct"] }
module-derive = { path = "../module-derive" }
capability-derive = { path = "../capability-derive" }


rkyv = "0.8.13"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
async-ffi = "0.5.0"
futures = "0.3.31"
tokio = { version = "1.49.0", features = ["full"] }
thiserror = "2.0.17"
pin-project = "1.1.10"
libloading = "0.9.0"
wasmtime = "40.0.1"
serde = "1.0.228"
serde_json = "1.0.149"
anyhow = "1.0.100"

capability-core = { path = "../capability-core" }
fs-err = "2.9"
toml = "0.9.11"
cargo_toml = "0.22.3"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tracing-test = "0.2.5"
trybuild = "1.0"
macrotest = "1.0"
tempfile = "3.24.0"