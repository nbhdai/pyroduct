[package]
name = "pyroduct"
version = { workspace = true }
description = "Dual trust computation framework"
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[features]
capability = [
    "dep:async-ffi",
    "dep:tokio",
    "dep:pin-project",
    "dep:libloading",
    "dep:futures",
]
host = [
    "dep:tokio",
    "dep:async-ffi",
    "dep:futures",
    "dep:wasmtime",
    "dep:arrow",
    "dep:parquet",
    "dep:libloading",
    "dep:pin-project",
    "dep:object",
    "dep:pyro-artifacts",
    "dep:pyro-file",
    "dep:rusqlite",
    "pyro-spec/arrow",
    "dep:reqwest",
]
sql = ["dep:datafusion", "dep:sqlparser"]
transport = ["host", "dep:axum"]
module = []

cli = [
    "dep:clap",
    "dep:crossterm",
    "dep:ratatui",
    "dep:ratatui-code-editor",
    "dep:serde_yaml",
    "dep:heck",
    "dep:fs-err",
    "dep:toml",
    "dep:pyro-macro",
    "dep:prettyplease",
    "host", # The CLI needs the host feature to execute pipelines
    "dep:pyro-file",
    "transport"
]

[dependencies]
pyro-artifacts = { workspace = true, optional = true }
pyro-spec.workspace = true
pyro-derive.workspace = true
rkyv.workspace = true
tracing.workspace = true

# Errors
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { workspace = true, optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }

# Value dependencies
half.workspace = true
paste = "1.0.15"
chrono = { version = "0.4.43", default-features = false, features = ["alloc"] }


tracing-subscriber.workspace = true
dashmap = "6.1.0"

# Async (not for wasm)
tokio = { workspace = true, optional = true }
async-ffi = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
async-trait = "0.1"
lazy_static = "1.4.0"
sha2 = "0.10.9"

# Arrow
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }
datafusion = { workspace = true, optional = true }
sqlparser = { version = "0.59.0", optional = true }

pin-project = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
object = { workspace = true, optional = true }
indexmap = { version = "2.13.0", features = ["serde"] }

# CLI
clap = { workspace = true, optional = true }
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.29.0", optional = true }
ratatui-code-editor = { version = "0.0.1", optional = true }
serde_yaml = { workspace = true, optional = true }
pyro-file = { workspace = true, optional = true }
heck = { workspace = true, optional = true }
fs-err = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
pyro-macro = { workspace = true, optional = true }
prettyplease = { workspace = true, optional = true }
memmap2.workspace = true

[[bin]]
name = "pyroduct"
path = "src/bin/cli/main.rs"
required-features = ["cli"]

[dev-dependencies]
trybuild.workspace = true
macrotest = "1.0"
tracing-test.workspace = true
tempfile.workspace = true
reqwest = { version = "0.12", features = ["json"] }

[[test]]
name = "derive_tests"
required-features = ["module", "capability"] 

[[test]]
name = "logs"
required-features = ["host"]

[[test]]
name = "integration_recovery"
required-features = ["host"]

[[test]]
name = "integration_session"
required-features = ["host"]

[[test]]
name = "integration_config"
required-features = ["host"]

[[test]]
name = "ffi_safety"
required-features = ["host", "capability"]

[[test]]
name = "test_socket_capability_server"
required-features = ["transport"]

[[test]]
name = "test_socket_playbook_server"
required-features = ["transport", "host"]

[[test]]
name = "test_socket_session_server"
required-features = ["transport", "host"]

[[test]]
name = "test_http_playbook_server"
required-features = ["transport", "host"]

[[test]]
name = "socket_capability"
required-features = ["transport", "host"]

[[test]]
name = "callbacks"
required-features = ["transport", "host"]



