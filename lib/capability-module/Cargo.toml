[package]
name = "capability-module"
version = "0.1.0"
edition = "2021"

[dependencies]
# Your core logic
capability-core = { path = "../capability-core", version = "0.1.0" }

# Parsing & Generation
syn = { version = "2.0", features = ["full", "extra-traits", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"

# CLI & Error Handling
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs-err = "2.9" # Better error messages for file I/O