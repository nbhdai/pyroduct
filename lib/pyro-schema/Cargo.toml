[package]
name = "pyro-schema"
version.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true

[features]
default = ["serde"]
serde = ["dep:serde"]
human = ["serde", "dep:serde_json"]
arrow = ["dep:arrow-schema", "dep:tracing", "serde"]
# Stub only (docs/pyro-schema-crate-plan.md, Step 6) — the function/interface
# spec itself is a follow-up design, not part of this move.
interface = []

[dependencies]
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }
arrow-schema = { version = "57.2.0", optional = true }
tracing = { version = "0.1.44", optional = true }

[dev-dependencies]
proptest = "1.8.0"
