[package]
name = "capability-core"
version = "0.1.0"
authors = ["Sven Cattell"]
edition = "2024"

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits", "parsing"] }
darling = "0.20"
heck = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

anyhow = "1.0"

[dev-dependencies]
prettyplease = "0.2.37"
