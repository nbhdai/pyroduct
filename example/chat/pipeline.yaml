capabilities:
  ollama:
    path: ../../capabilities/ollama/artifacts/lib.dylib
    classes:
      ollama:
        base_url: "http://localhost:11434"
        model: "gemma3"
        system_prompt: "You're a rude and unhelpful bot name Andrew. Talk about yourself."
        permitted_models: []

modules:
  gemma:
    path: ../../modules/chat/artifacts/mod.wasm
    capabilities:
      - ollama

pipeline:
  - gemma