name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Build & Test in Nix DevShell
        run: |
          nix develop --command bash -c "
            set -e
            export RUST_BACKTRACE=1
            prepare-pyro
            test-rust
          "

  install-test:
    name: Installer Tests (NixOS VM)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: NixOS Module Test
        run: nix build .#checks.x86_64-linux.nixos-module-test --print-build-logs

      - name: Install Script Test
        run: nix build .#checks.x86_64-linux.install-script-test --print-build-logs