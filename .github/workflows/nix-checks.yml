name: Nix Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  nix-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup cache
        uses: cachix/cachix-action@v15
        with:
          name: pyroduct # replace if using a cachix cache, or remove. Assuming it's safe to run without.
          skipPush: true

      - name: Run Nix flake check
        run: nix flake check -L

      - name: Run Miri Tests directly (optional safeguard)
        run: nix run .#test-miri
