name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The self-hosted NixOS runner only ships the node24 external; node20-based
  # actions (upload/download-artifact v4, gh-release) fail to start without this.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ===========================================================================
  # Build CLI + daemon release binaries
  # ===========================================================================
  build-cli:
    name: CLI + Daemon (${{ matrix.arch }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
          # - target: aarch64-unknown-linux-gnu
          #   os: linux
          #   arch: aarch64

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Build release binaries
        run: |
          nix develop --command bash -c "
            set -e

            echo '==> Building pyroduct CLI (release)...'
            cargo build --manifest-path lib/Cargo.toml \
              --release \
              -p pyroduct --features cli

            echo '==> Building pyro-daemond (release)...'
            cargo build --manifest-path lib/Cargo.toml \
              --release \
              -p pyro-daemon

            echo '==> Build complete'
            ls -lh target/release/pyroduct target/release/pyro-daemond
          "

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package tarball
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE_NAME="pyroduct-${VERSION}-${{ matrix.arch }}-${{ matrix.os }}"
          STAGING_DIR="$(mktemp -d)"

          mkdir -p "${STAGING_DIR}/${ARCHIVE_NAME}"

          # Copy binaries
          cp target/release/pyroduct   "${STAGING_DIR}/${ARCHIVE_NAME}/"
          cp target/release/pyro-daemond "${STAGING_DIR}/${ARCHIVE_NAME}/"

          # Strip debug symbols to reduce size
          strip "${STAGING_DIR}/${ARCHIVE_NAME}/pyroduct" || true
          strip "${STAGING_DIR}/${ARCHIVE_NAME}/pyro-daemond" || true

          # Include install helper and license
          cp install.sh "${STAGING_DIR}/${ARCHIVE_NAME}/"
          cp LICENSE     "${STAGING_DIR}/${ARCHIVE_NAME}/"
          cp README.md   "${STAGING_DIR}/${ARCHIVE_NAME}/"

          # Create tarball
          tar -czf "${ARCHIVE_NAME}.tar.gz" -C "${STAGING_DIR}" "${ARCHIVE_NAME}"

          echo "archive_name=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "==> Created ${ARCHIVE_NAME}.tar.gz"
          ls -lh "${ARCHIVE_NAME}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_name }}
          retention-days: 1

  # ===========================================================================
  # Build Tauri GUI bundles (.deb, .rpm)
  # ===========================================================================
  build-gui:
    name: GUI (${{ matrix.arch }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          # The unlabeled self-hosted pool is x86_64 and the build never used
          # matrix.target, so this entry produced x86_64 binaries mislabeled
          # as aarch64. Re-enable once a dedicated ARM64 runner label exists
          # (cf. the commented-out entry in build-cli above).
          # - target: aarch64-unknown-linux-gnu
          #   arch: aarch64

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Build Tauri GUI
        run: |
          nix develop --command bash -c "
            set -e

            # Install frontend dependencies
            cd lib/pyro-gui/ui
            npm ci
            cd ../../..

            # Build the Tauri application (produces .deb and .rpm).
            # AppImage is skipped: tauri's bundler downloads a linuxdeploy
            # binary that cannot execute on the NixOS runner.
            cd lib/pyro-gui
            cargo tauri build --bundles deb,rpm
            cd ../..

            echo '==> Tauri build complete'
            find target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' \) -ls
          "

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Collect GUI artifacts
        id: collect
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          OUTDIR="gui-artifacts"
          mkdir -p "$OUTDIR"

          # Copy .deb bundle
          DEB_FILE=$(find target/release/bundle/deb -name '*.deb' -type f | head -1)
          if [ -n "$DEB_FILE" ]; then
            DEB_NAME="pyroduct-gui_${VERSION}_${ARCH}.deb"
            cp "$DEB_FILE" "${OUTDIR}/${DEB_NAME}"
            echo "deb_name=${DEB_NAME}" >> "$GITHUB_OUTPUT"
            echo "==> Packaged: ${DEB_NAME}"
          fi

          # Copy .rpm bundle
          RPM_FILE=$(find target/release/bundle/rpm -name '*.rpm' -type f | head -1)
          if [ -n "$RPM_FILE" ]; then
            RPM_NAME="pyroduct-gui-${VERSION}-1.${ARCH}.rpm"
            cp "$RPM_FILE" "${OUTDIR}/${RPM_NAME}"
            echo "rpm_name=${RPM_NAME}" >> "$GITHUB_OUTPUT"
            echo "==> Packaged: ${RPM_NAME}"
          fi

          ls -lh "${OUTDIR}/"

      - name: Upload GUI .deb
        if: steps.collect.outputs.deb_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.deb_name }}
          path: gui-artifacts/${{ steps.collect.outputs.deb_name }}
          retention-days: 1

      - name: Upload GUI .rpm
        if: steps.collect.outputs.rpm_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.rpm_name }}
          path: gui-artifacts/${{ steps.collect.outputs.rpm_name }}
          retention-days: 1

  # ===========================================================================
  # Build CLI + daemon release binaries (macOS)
  # ===========================================================================
  build-cli-macos:
    name: CLI + Daemon (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15   # Apple Silicon (arm64)
            arch: aarch64
          - runner: macos-15-intel   # Intel (x86_64) — macos-13 was retired Dec 2025; this label is supported until Aug 2027
            arch: x86_64

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Ensure Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version

      - name: Build release binaries
        run: |
          set -e
          echo '==> Building pyroduct CLI (release)...'
          cargo build --manifest-path lib/Cargo.toml --release -p pyroduct --features cli
          echo '==> Building pyro-daemond (release)...'
          cargo build --manifest-path lib/Cargo.toml --release -p pyro-daemon
          ls -lh target/release/pyroduct target/release/pyro-daemond

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package tarball
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE_NAME="pyroduct-${VERSION}-${{ matrix.arch }}-macos"
          STAGING_DIR="$(mktemp -d)"
          mkdir -p "${STAGING_DIR}/${ARCHIVE_NAME}"

          cp target/release/pyroduct    "${STAGING_DIR}/${ARCHIVE_NAME}/"
          cp target/release/pyro-daemond "${STAGING_DIR}/${ARCHIVE_NAME}/"

          strip "${STAGING_DIR}/${ARCHIVE_NAME}/pyroduct" || true
          strip "${STAGING_DIR}/${ARCHIVE_NAME}/pyro-daemond" || true

          cp install.sh "${STAGING_DIR}/${ARCHIVE_NAME}/"
          cp LICENSE     "${STAGING_DIR}/${ARCHIVE_NAME}/"
          cp README.md   "${STAGING_DIR}/${ARCHIVE_NAME}/"

          tar -czf "${ARCHIVE_NAME}.tar.gz" -C "${STAGING_DIR}" "${ARCHIVE_NAME}"
          echo "archive_name=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          ls -lh "${ARCHIVE_NAME}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_name }}
          retention-days: 1

  # ===========================================================================
  # Build Tauri GUI bundle (.dmg) for macOS
  # ===========================================================================
  build-gui-macos:
    name: GUI (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15   # Apple Silicon (arm64)
            arch: aarch64
          - runner: macos-15-intel   # Intel (x86_64) — macos-13 was retired Dec 2025; this label is supported until Aug 2027
            arch: x86_64

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Ensure Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri GUI (.app + .dmg)
        run: |
          set -e
          # Install frontend dependencies
          ( cd lib/pyro-gui/ui && npm ci )
          # Build the Tauri application (produces .app and .dmg)
          ( cd lib/pyro-gui && cargo tauri build --bundles app,dmg )
          echo '==> Tauri build complete'
          find target/release/bundle -type f -name '*.dmg' -print

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Collect GUI artifact
        id: collect
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          OUTDIR="gui-artifacts"
          mkdir -p "$OUTDIR"

          DMG_FILE=$(find target/release/bundle/dmg -name '*.dmg' -type f | head -1)
          if [ -n "$DMG_FILE" ]; then
            DMG_NAME="Pyroduct_GUI-${VERSION}-${ARCH}-macos.dmg"
            cp "$DMG_FILE" "${OUTDIR}/${DMG_NAME}"
            echo "dmg_name=${DMG_NAME}" >> "$GITHUB_OUTPUT"
            echo "==> Packaged: ${DMG_NAME}"
          fi
          ls -lh "${OUTDIR}/"

      - name: Upload GUI .dmg
        if: steps.collect.outputs.dmg_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.dmg_name }}
          path: gui-artifacts/${{ steps.collect.outputs.dmg_name }}
          retention-days: 1

  # ===========================================================================
  # Create GitHub Release with all artifacts
  # ===========================================================================
  release:
    name: Create Release
    needs: [build-cli, build-gui, build-cli-macos, build-gui-macos]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.deb *.rpm *.dmg 2>/dev/null > SHA256SUMS || true
          cat SHA256SUMS

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pyroduct ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.dmg
            artifacts/SHA256SUMS
          body: |
            ## Installation

            ### CLI + Daemon (quick install)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/nbhdai/pyroduct/${{ github.ref_name }}/install.sh | bash -s -- --default
            ```

            ### CLI + Daemon (manual)
            ```bash
            # x86_64 Linux
            curl -fsSL -o pyroduct.tar.gz \
              https://github.com/nbhdai/pyroduct/releases/download/${{ github.ref_name }}/pyroduct-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz
            tar xzf pyroduct.tar.gz
            sudo cp pyroduct-*/pyroduct pyroduct-*/pyro-daemond /usr/local/bin/
            ```

            ### GUI (Debian/Ubuntu)
            ```bash
            curl -fsSL -o pyroduct-gui.deb \
              https://github.com/nbhdai/pyroduct/releases/download/${{ github.ref_name }}/pyroduct-gui_${{ steps.version.outputs.version }}_x86_64.deb
            sudo dpkg -i pyroduct-gui.deb
            ```

            ### GUI (Fedora/RHEL — .rpm)
            ```bash
            curl -fsSL -o pyroduct-gui.rpm \
              https://github.com/nbhdai/pyroduct/releases/download/${{ github.ref_name }}/pyroduct-gui-${{ steps.version.outputs.version }}-1.x86_64.rpm
            sudo rpm -i pyroduct-gui.rpm
            ```

            ### macOS (CLI + Daemon)
            ```bash
            # Apple Silicon (arm64) — use the x86_64 tarball on Intel Macs
            curl -fsSL -o pyroduct.tar.gz \
              https://github.com/nbhdai/pyroduct/releases/download/${{ github.ref_name }}/pyroduct-${{ steps.version.outputs.version }}-aarch64-macos.tar.gz
            tar xzf pyroduct.tar.gz
            ./pyroduct-*/install.sh
            ```

            ### macOS GUI (.dmg)
            Download `Pyroduct_GUI-${{ steps.version.outputs.version }}-aarch64-macos.dmg`, open it, and drag the app to Applications.
            The build is unsigned — on first launch right-click the app → **Open**, or run:
            ```bash
            xattr -dr com.apple.quarantine "/Applications/Pyroduct GUI.app"
            ```

            ### Verify checksums
            ```bash
            sha256sum -c SHA256SUMS
            ```
